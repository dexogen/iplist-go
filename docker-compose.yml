services:
  app:
    build:
      context: .
    environment:
      HTTP_PORT: ${HTTP_PORT:-8080}
      IPLIST_SNAPSHOT_URL: ${IPLIST_SNAPSHOT_URL:-https://github.com/dexogen/iplist-go-sidecar/releases/download/data/manifest.json}
      IPLIST_SNAPSHOT_INTERVAL: ${IPLIST_SNAPSHOT_INTERVAL:-30m}
      IPLIST_SNAPSHOT_TIMEOUT: ${IPLIST_SNAPSHOT_TIMEOUT:-3m}
      IPLIST_SNAPSHOT_MAX_AGE: ${IPLIST_SNAPSHOT_MAX_AGE:-48h}
      IPLIST_DNS_REFRESH_ENABLED: ${IPLIST_DNS_REFRESH_ENABLED:-true}
      IPLIST_DNS_REFRESH_CRON: "${IPLIST_DNS_REFRESH_CRON:-0 */12 * * *}"
      IPLIST_DNS_REFRESH_TIMEZONE: ${IPLIST_DNS_REFRESH_TIMEZONE:-UTC}
      IPLIST_DNS_REFRESH_TIMEOUT: ${IPLIST_DNS_REFRESH_TIMEOUT:-4s}
      IPLIST_DNS_REFRESH_CONCURRENCY: ${IPLIST_DNS_REFRESH_CONCURRENCY:-8}
      IPLIST_DNS_REFRESH_ON_START: ${IPLIST_DNS_REFRESH_ON_START:-true}
      IPLIST_DNS_SERVERS: ${IPLIST_DNS_SERVERS:-}
      IPLIST_DNS_USE_SOURCE_SERVERS: ${IPLIST_DNS_USE_SOURCE_SERVERS:-false}
      IPLIST_DNS_STALE_AFTER: ${IPLIST_DNS_STALE_AFTER:-168h}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - dns-runtime:/app/runtime
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

volumes:
  dns-runtime:
