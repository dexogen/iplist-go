name: Build image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=short

      - name: Build smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: iplist-go:smoke

      - name: Smoke test image
        run: |
          cleanup() {
            docker rm -f iplist-go-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name iplist-go-smoke -p 18080:8080 -e IPLIST_DNS_REFRESH_ENABLED=false iplist-go:smoke
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/latest/catalog >/tmp/catalog.json; then
              break
            fi
            sleep 2
          done
          test -s /tmp/catalog.json
          curl -fsS 'http://127.0.0.1:18080/api/latest/export?format=unifi&data=domains' | head -n 5
          curl -fsS http://127.0.0.1:18080/ | grep -q '<!doctype html>'

      - name: Publish multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
